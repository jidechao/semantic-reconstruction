[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-reconstruction"
version = "1.0.0"
description = "Production Python SDK for Markdown semantic reconstruction with auditable evidence"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Semantic Reconstruction contributors"}]
dependencies = [
  "openai>=1.0.0",
]
keywords = ["semantic reconstruction", "knowledge base", "markdown", "enterprise knowledge"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "build>=1.2.0",
]

[project.scripts]
semantic-reconstruction = "semantic_reconstruction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semantic_reconstruction = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


