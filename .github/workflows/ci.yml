name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Build distributions
        run: python -m build --outdir dist-ci
      - name: Verify wheel excludes secrets and private fixtures
        shell: python
        run: |
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          wheels = list(Path("dist-ci").glob("*.whl"))
          sdists = list(Path("dist-ci").glob("*.tar.gz"))
          assert wheels, "wheel build output missing"
          assert sdists, "sdist build output missing"

          for archive in wheels:
              with zipfile.ZipFile(archive) as bundle:
                  names = bundle.namelist()
                  assert not any(name.endswith(".env") for name in names)
                  assert not any("SUPERPOWERS" in name or "taste-skill" in name or "README_CN" in name for name in names)

          for archive in sdists:
              with tarfile.open(archive) as bundle:
                  names = bundle.getnames()
                  assert not any(name.endswith(".env") for name in names)
                  assert not any("SUPERPOWERS" in name or "taste-skill" in name or "README_CN" in name for name in names)

          print("distribution safety checks passed")

